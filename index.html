<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Marriage Quest</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0a0a1f;
        height: 100%;
        overflow: hidden;
        font-family: "Press Start 2P", monospace;
        color: #fff;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
      }
      #game {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        box-shadow: 0 0 32px #ff6ec7;
        border: 4px solid #ff6ec7;
        max-width: 100%;
        max-height: 100%;
        touch-action: none;
      }
      /* Drop the glow border on small screens so the canvas can fill the viewport */
      @media (max-width: 820px), (max-height: 620px) {
        canvas {
          border-width: 0;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
    <script src="data/theme.js"></script>
    <script src="data/messages.js"></script>
    <script src="data/gameState.js"></script>
    <script src="scenes/BaseScene.js"></script>
    <script src="scenes/TitleScene.js"></script>
    <script src="scenes/AvatarScene.js"></script>
    <script src="scenes/OverworldScene.js"></script>
    <script src="quests/QuestSockMonster.js"></script>
    <script src="quests/QuestCoffeeCups.js"></script>
    <script src="quests/QuestWeddingRing.js"></script>
    <script src="quests/QuestCookTogether.js"></script>
    <script src="quests/QuestPlanTrip.js"></script>
    <script src="quests/QuestVows.js"></script>
    <script src="quests/QuestDance.js"></script>
    <script src="quests/QuestPhotoAlbum.js"></script>
    <script src="quests/QuestGarden.js"></script>
    <script src="quests/QuestCake.js"></script>
    <script src="scenes/FinaleScene.js"></script>
    <script src="main.js"></script>
  </body>
</html>
