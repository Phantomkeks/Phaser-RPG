<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Marriage Quest</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0a0a1f;
      height: 100%;
      overflow: hidden;
      font-family: 'Press Start 2P', monospace;
      color: #fff;
    }
    #game {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      box-shadow: 0 0 32px #ff6ec7;
      border: 4px solid #ff6ec7;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script src="js/data/messages.js"></script>
  <script src="js/data/gameState.js"></script>
  <script src="js/scenes/TitleScene.js"></script>
  <script src="js/scenes/AvatarScene.js"></script>
  <script src="js/scenes/OverworldScene.js"></script>
  <script src="js/scenes/QuestSockMonster.js"></script>
  <script src="js/scenes/QuestCoffeeCups.js"></script>
  <script src="js/scenes/QuestWeddingRing.js"></script>
  <script src="js/scenes/QuestCookTogether.js"></script>
  <script src="js/scenes/QuestPlanTrip.js"></script>
  <script src="js/scenes/FinaleScene.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
